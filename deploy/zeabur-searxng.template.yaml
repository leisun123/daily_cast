# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: DailyCast private SearXNG
spec:
  description: Private JSON search backend used only by DailyCast briefing discovery.
  services:
    - name: searxng
      template: PREBUILT_V2
      spec:
        id: searxng
        source:
          image: searxng/searxng:latest
        ports:
          - id: web
            port: 8080
            type: HTTP
        portForwarding:
          enabled: false
        healthCheck:
          type: TCP
          port: web
        configs:
          - path: /etc/searxng/settings.yml
            envsubst: true
            template: |
              use_default_settings: true

              general:
                instance_name: DailyCast private search

              server:
                secret_key: "${SEARXNG_SECRET}"
                bind_address: "0.0.0.0"
                port: 8080
                public_instance: false
                limiter: false

              search:
                formats:
                  - html
                  - json
                safe_search: 1
        env:
          SEARXNG_BASE_URL:
            default: http://searxng.zeabur.internal:8080
          SEARXNG_SECRET:
            default: ${PASSWORD}
