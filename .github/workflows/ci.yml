name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --with dev
      - name: Ruff
        run: poetry run ruff check .
      - name: Ruff format
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy src
      - name: Pytest
        run: poetry run pytest
      - name: Docker build
        run: docker build --tag dailycast:0.1.0-alpha .
      - name: Docker startup
        run: DAILYCAST_RUN_DOCKER_TEST=1 poetry run pytest tests/integration/test_docker_startup.py
