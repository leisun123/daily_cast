<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DailyCast{% endblock %}</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 3rem; line-height: 1.6; }
      nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; }
      nav a:first-child { font-weight: 700; color: inherit; text-decoration: none; }
      a { color: #146cbd; } article, section { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
      .muted { color: #667085; } .status { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      audio { width: 100%; margin: .75rem 0; } button { padding: .55rem .9rem; cursor: pointer; }
      pre { white-space: pre-wrap; font-family: inherit; } table { width: 100%; border-collapse: collapse; } th, td { padding: .5rem; border-bottom: 1px solid #d0d7de; text-align: left; vertical-align: top; }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">DailyCast</a>
      <a href="/tasks/latest">最新任务</a>
      <a href="/feed.xml">RSS</a>
    </nav>
    {% block content %}{% endblock %}
  </body>
</html>
