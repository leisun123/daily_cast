apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: DailyCast
spec:
  description: Daily AI news podcast with immutable RSS publication.
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Public podcast domain
      description: Public HTTPS domain used by the RSS Feed and immutable MP3 URLs.
    - key: DAILYCAST_LLM__PROVIDER
      type: STRING
      name: Primary LLM provider
      description: Preferred provider protocol; use openai_responses for GPT-5.6 Terra.
    - key: DAILYCAST_LLM__BASE_URL
      type: STRING
      name: Primary LLM base URL
      description: Preferred endpoint without embedded credentials.
    - key: DAILYCAST_LLM__MODEL
      type: STRING
      name: Primary LLM model
      description: Preferred model identifier, such as gpt-5.6-terra.
    - key: DAILYCAST_LLM__API_KEY
      type: PASSWORD
      name: Primary LLM API key
      description: Preferred endpoint secret stored only in Zeabur environment configuration.
    - key: DAILYCAST_LLM__FALLBACKS__0__PROVIDER
      type: STRING
      name: First fallback LLM provider
      description: Tried after a primary provider failure; use openai_compatible for DeepSeek.
    - key: DAILYCAST_LLM__FALLBACKS__0__BASE_URL
      type: STRING
      name: First fallback LLM base URL
      description: Fallback endpoint without embedded credentials.
    - key: DAILYCAST_LLM__FALLBACKS__0__MODEL
      type: STRING
      name: First fallback LLM model
      description: Fallback model identifier, such as deepseek-chat.
    - key: DAILYCAST_LLM__FALLBACKS__0__API_KEY
      type: PASSWORD
      name: First fallback LLM API key
      description: Fallback endpoint secret stored only in Zeabur environment configuration.
    - key: DAILYCAST_LLM__FALLBACKS__1__PROVIDER
      type: STRING
      name: Second fallback LLM provider (optional)
      description: Tried after the first fallback also fails; leave unset to keep a two-provider chain.
    - key: DAILYCAST_LLM__FALLBACKS__1__BASE_URL
      type: STRING
      name: Second fallback LLM base URL (optional)
    - key: DAILYCAST_LLM__FALLBACKS__1__MODEL
      type: STRING
      name: Second fallback LLM model (optional)
    - key: DAILYCAST_LLM__FALLBACKS__1__API_KEY
      type: PASSWORD
      name: Second fallback LLM API key (optional)
    - key: DAILYCAST_BRIEFING__WEBHOOK_URL
      type: PASSWORD
      name: Daily briefing webhook URL
      description: WeCom group-bot webhook (or any JSON webhook) that receives the daily text briefing; required because briefing pushes are enabled in the deployment config.
  tags:
    - AI
    - Tool
  readme: |-
    # DailyCast

    The service builds the `main` branch directly from the connected GitHub repository.
    SQLite, task artifacts, generated audio, and published RSS media are stored in persistent
    Zeabur volumes. The public domain exposes diagnostics, `feed.xml`, and immutable MP3 files;
    unauthenticated management and generation routes remain hidden.
  services:
    - name: DailyCast
      template: GIT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1309505877
          branch: main
        ports:
          - id: web
            port: 8000
            type: HTTP
        volumes:
          - id: data
            dir: /app/data
          - id: public
            dir: /app/public
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /healthz
        env:
          DAILYCAST_CONFIG_PATH:
            default: /app/config/zeabur.yaml
          # An indexed env block replaces the whole YAML fallback entry, so the
          # stable response mode and timeout travel with the endpoint fields.
          DAILYCAST_LLM__FALLBACKS__0__RESPONSE_FORMAT:
            default: json_object
          DAILYCAST_LLM__FALLBACKS__0__TIMEOUT_SECONDS:
            default: 300
          DAILYCAST_PUBLISHING__PUBLIC_BASE_URL:
            default: ${ZEABUR_WEB_URL}
        instructions:
          - title: RSS Feed
            content: ${ZEABUR_WEB_URL}/feed.xml
          - title: Readiness
            content: ${ZEABUR_WEB_URL}/readyz
