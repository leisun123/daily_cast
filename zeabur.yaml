apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: DailyCast
spec:
  description: Daily AI news podcast with immutable RSS publication.
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Public podcast domain
      description: Public HTTPS domain used by the RSS Feed and immutable MP3 URLs.
    - key: LLM_PROVIDER
      type: STRING
      name: LLM provider
      description: Application provider name, such as openai_responses or openai_compatible.
    - key: LLM_BASE_URL
      type: STRING
      name: LLM base URL
      description: Application endpoint without embedded credentials.
    - key: LLM_MODEL
      type: STRING
      name: LLM model
      description: Model identifier supported by the configured endpoint.
    - key: LLM_API_KEY
      type: PASSWORD
      name: LLM API key
      description: Secret API key stored only in Zeabur environment configuration.
  tags:
    - AI
    - Tool
  readme: |-
    # DailyCast

    The service builds the `main` branch directly from the connected GitHub repository.
    SQLite, task artifacts, generated audio, and published RSS media are stored in persistent
    Zeabur volumes. The public domain exposes diagnostics, `feed.xml`, and immutable MP3 files;
    unauthenticated management and generation routes remain hidden.
  services:
    - name: DailyCast
      template: GIT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1309505877
          branch: main
        ports:
          - id: web
            port: 8000
            type: HTTP
        volumes:
          - id: data
            dir: /app/data
          - id: public
            dir: /app/public
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /healthz
        env:
          DAILYCAST_CONFIG_PATH:
            default: /app/config/zeabur.yaml
          DAILYCAST_PUBLISHING__PUBLIC_BASE_URL:
            default: ${ZEABUR_WEB_URL}
        instructions:
          - title: RSS Feed
            content: ${ZEABUR_WEB_URL}/feed.xml
          - title: Readiness
            content: ${ZEABUR_WEB_URL}/readyz
