apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: DailyCast
spec:
  description: Daily AI news podcast with immutable RSS publication.
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Public podcast domain
      description: Public HTTPS domain used by the RSS Feed and immutable MP3 URLs.
    - key: DAILYCAST_LLM__BASE_URL
      type: STRING
      name: LLM base URL
      description: OpenAI Responses-compatible endpoint without embedded credentials.
    - key: DAILYCAST_LLM__API_KEY
      type: PASSWORD
      name: LLM API key
      description: Secret API key stored only in Zeabur environment configuration.
  tags:
    - AI
    - Tool
  readme: |-
    # DailyCast

    The service builds the `main` branch directly from the connected GitHub repository.
    SQLite, task artifacts, generated audio, and published RSS media are stored in persistent
    Zeabur volumes. The public domain exposes diagnostics, `feed.xml`, and immutable MP3 files;
    unauthenticated management and generation routes remain hidden.
  services:
    - name: DailyCast
      template: GIT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1309505877
          branch: main
        ports:
          - id: web
            port: 8000
            type: HTTP
        volumes:
          - id: data
            dir: /app/data
          - id: public
            dir: /app/public
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /healthz
        env:
          DAILYCAST_CONFIG_PATH:
            default: /app/config/zeabur.yaml
            readonly: true
        configs:
          - path: /app/config/zeabur.yaml
            permission: 420
            envsubst: true
            template: |-
              app:
                environment: production
                timezone: Asia/Shanghai
                public_only: true
                server:
                  host: 0.0.0.0
                  port: 8000

              scheduler:
                enabled: true
                cron_expression: "0 6 * * *"

              llm:
                provider: openai_responses
                model: gpt-5.6-terra

              editorial:
                enforce_quality_gate: false

              publishing:
                auto_publish: true
                public_base_url: ${ZEABUR_WEB_URL}
                rss:
                  enabled: true
                netease:
                  enabled: true
                  profile_dir: netease/profile
                  storage_state_path: netease/storage-state.json
                  headless: true
                  creator_url: https://musicupload.netease.com/
                  category: 科技
                xiaoyuzhou:
                  enabled: false
        instructions:
          - title: RSS Feed
            content: ${ZEABUR_WEB_URL}/feed.xml
          - title: Readiness
            content: ${ZEABUR_WEB_URL}/readyz
