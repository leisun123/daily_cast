# Stable, non-secret settings for the GitHub-based Zeabur deployment. Dynamic
# LLM credentials and the Zeabur public origin remain environment values.
app:
  environment: production
  timezone: Asia/Shanghai
  public_only: true
  server:
    host: 0.0.0.0
    port: 8000

database:
  url: sqlite:////app/data/dailycast.db

storage:
  data_dir: /app/data
  public_dir: /app/public

scheduler:
  enabled: true
  cron_expression: "0 6 * * *"

# DeepSeek's OpenAI-compatible Chat Completions endpoint accepts JSON mode,
# rather than the OpenAI-specific json_schema response format.
llm:
  response_format: json_object
  timeout_seconds: 120
  fallback:
    response_format: json_object
    # A reasoning model regenerating a full briefing can outrun the primary
    # 120s budget during peak hours; the fallback only runs when the primary
    # already failed, so give it the widest legal headroom.
    timeout_seconds: 300
  # A seven-section Chinese episode plus semantic review and metadata can reserve
  # more than the general 60k default before provider calls are made.
  budget:
    max_input_tokens: 100000

editorial:
  enforce_quality_gate: false

# The telecom + AI text briefing is fully prepared before 08:30 Asia/Shanghai.
# The 08:30 tick only posts the atomically saved message; it never starts
# collection, link verification, or model generation. The webhook URL is a
# Zeabur password variable; the service refuses to start without it.
briefing:
  enabled: true
  sources_config_path: ./config/briefing.sources.yaml
  selection_policy_path: ./config/briefing.selection.yaml
  preparation_cron_expression: "55 7 * * mon-fri"
  preparation_retry_cron_expression: "15 8 * * mon-fri"
  cron_expression: "30 8 * * mon-fri"
  max_items_per_category: 6
  # Inject DAILYCAST_BRIEFING__RSSHUB_BASE_URL as a Zeabur variable to enable
  # configured rsshub:// sources. Use a controlled or self-hosted instance.
  rsshub_base_url: null
  webhook_enabled: true
  webhook_format: wecom_markdown_v2

# Operational alerts go to a separate Enterprise WeChat robot. Set
# DAILYCAST_MONITORING__WEBHOOK_URL in Zeabur; no extra enable switch is used.
monitoring:
  webhook_format: wecom_markdown_v2

# Search discovery uses the configured GPT Responses provider's native web-search
# tool. Every returned URL is still fetched, publication-date checked, and
# link-verified locally before a briefing may use it.
web_research:
  enabled: true
  max_candidates_per_source: 60
  max_search_calls_per_source: 4
  search_context_size: medium
  max_article_chars: 12000

publishing:
  auto_publish: true
