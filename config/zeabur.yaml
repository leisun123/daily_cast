# Stable, non-secret settings for the GitHub-based Zeabur deployment. Dynamic
# LLM credentials and the Zeabur public origin remain environment values.
app:
  environment: production
  timezone: Asia/Shanghai
  public_only: true
  server:
    host: 0.0.0.0
    port: 8000

database:
  url: sqlite:////app/data/dailycast.db

storage:
  data_dir: /app/data
  public_dir: /app/public

scheduler:
  enabled: true
  cron_expression: "0 6 * * *"

# DeepSeek's OpenAI-compatible Chat Completions endpoint accepts JSON mode,
# rather than the OpenAI-specific json_schema response format.
llm:
  response_format: json_object
  timeout_seconds: 120
  # DeepSeek emits reasoning tokens before JSON. Real score and outline
  # batches truncate below 8,192 output tokens.
  max_output_tokens: 8192
  budget:
    # Five normal Alpha editorial calls plus one bounded schema-repair call.
    max_output_tokens: 49152

editorial:
  enforce_quality_gate: false

publishing:
  auto_publish: true
