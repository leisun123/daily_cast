# Non-secret production defaults for GitHub-based Zeabur deployments.
# Keep deployment-specific endpoint and credential values in Zeabur variables.
app:
  environment: production
  timezone: Asia/Shanghai
  public_only: true
  server:
    host: 0.0.0.0
    port: 8000

scheduler:
  enabled: true
  cron_expression: "0 6 * * *"

llm:
  provider: openai_responses
  model: gpt-5.6-terra

editorial:
  enforce_quality_gate: false

publishing:
  auto_publish: true
  rss:
    enabled: true
  netease:
    enabled: true
    profile_dir: netease/profile
    storage_state_path: netease/storage-state.json
    headless: true
    creator_url: https://musicupload.netease.com/
    category: 科技
  xiaoyuzhou:
    enabled: false
