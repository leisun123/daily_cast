# Briefing-only source seeds for the daily telecom + AI text briefing pushed to
# a webhook target. Each entry carries `config.briefing_category` ("telecom" | "ai"); RSS
# collectors ignore that key, so these rows are safe to also exist for the
# podcast pipeline. Briefing source rows are synchronized from this file on
# startup while their historical articles and operational status remain intact.
#
# Verified 2026-08 (DailyCast UA):
# - C114's RSS generation froze around 2026-08-21 (the feeds still return the
#   same mid-August items, without pubDate elements), and c114.com.cn also
#   intermittently drops datacenter connections. The telecom brief therefore
#   reads C114's server-rendered operator (www.c114.com.cn/local/) and
#   equipment (www.c114.com.cn/news/18.html) channel pages instead: gb2312
#   pages whose dated entries sit inside div.newsText blocks and link to
#   /news/... article paths. The html_list collector handles these through the
#   `date_context_tags`, `allow_month_day_dates` ("9/3" style dates) and
#   charset-aware decoding options. The broader C114 top-news surface stays
#   excluded: its rolling front page has no per-entry dates at all.
# - miit.gov.cn returns a dated, UTF-8 HTML news list. Its dated, same-host
#   announcements enter the candidate pool; the LLM distinguishes
#   information-communications policy from general industrial news.
# - GSMA's official RSS and ZTE's official newsroom are directly reachable and
#   retain their own public article URLs. The ZTE URL-path boundary excludes
#   its dated solution-navigation links from being mistaken for news.
# - AIHOT (aihot.virxact.com) is a mainland-hosted, ICP-filed Chinese AI news
#   aggregator with a public RSS feed (feed/all.xml, 7-day deduplicated
#   window), re-adopted 2026-09-04 after re-verification from the deployment.
#   Its entries link to the original article ("阅读原文"); candidates whose
#   original needs VPN are rejected by the briefing reachability rule.
# - 量子位 (qbitai.com/feed) re-verified 2026-09-04 from the deployment: pure
#   zh-CN AI coverage with minute-fresh pubDates, now part of the seeds.
#   IT之家's same RSS URL already belongs to the default `ithome-rss` source;
#   it must not be declared again under a briefing-only identity.
# - 雷峰网 (leiphone.com/feed) verified 2026-08-24 without proxy: full-text
#   zh-CN RSS with strong AI/robotics coverage; the LLM, rather than title
#   keywords, rejects consumer and capital-market stories when they lack value.
# - 机器之心 (jiqizhixin.com) has retired its public RSS and gates its data
#   API behind a paid "数据服务" offering (/rss 302s to a marketing page,
#   API returns 403/404). Do not scrape it. Its articles stay reachable via
#   web research: the AI query names it as a preferred Chinese AI outlet,
#   and each discovered original link still passes the normal direct-page
#   verification before ranking.
#
# Excluded on purpose:
# - RCR Wireless is directly reachable from mainland China (verified
#   2026-08-24 without proxy: feed and article pages return HTTP 200 behind
#   Cloudflare), but it is English-language. The briefings are Chinese-language
#   reports for a Chinese management audience, so English-only sources are kept
#   out of the AI category regardless of reachability.
# - China Telecom's newsroom currently answers HTTP 412 to the collection
#   request; China Mobile and China Unicom need a separate stable retrieval
#   check before becoming default sources. CAICT sources are valuable but are
#   likewise held back until their public list endpoint is stable end-to-end.
# - news.cctv.com/rss/keji.xml is 404. 36Kr's own RSS center is retained as a
#   fallback option, but current direct requests receive an anti-bot HTML page.
#   Comprehensive hot lists and newsflash feeds (36Kr hot list / newsflashes)
#   stay excluded on purpose: under the freshness-ordered per-publisher cap
#   their capital-market and society items crowd vertical candidates out of
#   the pool before editorial review. The deployment's own RSSHub instance
#   instead serves the AIbase vertical route (see the note at the end of
#   `sources:`); RSSHub's /c114/roll route was evaluated on 2026-09-04 and
#   rejected — its detail-page date parsing no longer matches C114's markup
#   ("Invalid Date" on every entry), so C114 stays on the direct channel-page
#   collectors above. No reachable telecom-vertical RSS exists beyond those:
#   通信世界网 is JS-rendered without feeds, 飞象网 and 讯石光通讯 reject
#   datacenter connections, 人民邮电网 serves an incomplete TLS chain.
# - Google News keyword RSS links are JS interstitials (no server redirect, no
#   extractable body) and require VPN to open - violates the "links must be
#   reachable without VPN" requirement.
# - OpenAI / Hugging Face / Google AI blog feeds work technically, but their
#   links need VPN from mainland China. Re-add only if deploying overseas.
# - OpenAI Responses web search is a discovery capability, not a source of
#   evidence. Its two internal source identities below are fetched and verified
#   by DailyCast before they may enter either briefing category.
sources:
  - id: openai-web-research-telecom-management
    name: 网页研究·通信管理视角
    kind: web_research
    entry_url: research://telecom-management
    priority: 95
    language: zh-CN
    request_timeout_seconds: 20
    max_items_per_run: 60
    config:
      briefing_category: telecom
      topic: telecom
      query: >-
        严格只搜索时间窗口内的国内通信行业新闻。按常州市、江苏省、国内其他地级市、
        全国的顺序检索，每个范围都必须显式搜索中国移动、中国电信和中国联通，并覆盖
        经营竞争、基站与无线网建设、频谱、5G-A/6G、算力网络、国内通信政策、地方项目、
        华为中兴和关键供应商交付，以及运营商大模型、智能体、网络智能化、Token 经营和
        AI 业务落地。优先监管机构、运营商、地方政府或供应商第一方原文；
        不得返回国外运营商、国际行业预测、电信诈骗、消费电子或泛民生内容。
      publisher_preference: regulator_operator_vendor_first_party
      require_verified_publication_date: true
  - id: openai-web-research-ai-management
    name: 网页研究·AI管理视角
    kind: web_research
    entry_url: research://ai-management
    priority: 95
    language: zh-CN
    request_timeout_seconds: 20
    max_items_per_run: 60
    config:
      briefing_category: ai
      topic: ai
      query: >-
        严格只搜索时间窗口内由中文页面或国内中文媒体报道的全球 AI 发展新闻，事件发生地和公司
        国别不限。既覆盖字节、腾讯、华为、小米、阿里、百度、DeepSeek、智谱、月之暗面、MiniMax，
        也覆盖 OpenAI GPT、Anthropic Claude、Google Gemini、Meta Llama、xAI Grok 等全球大模型发布、
        升级与开源，并关注本地化或私有化部署、AI 基础设施与芯片、已有明确产品或市场热度
        的热门应用、智能体和具身智能。原文正文必须以中文为主，外文媒体原文不得作为来源；不得返回
        以运营商经营或网络建设为主体的新闻，这类内容归入通信板块。排除通用办公噱头、法律模型、
        泛安全应用、纯论文、预印本和榜单。
      publisher_preference: chinese_language_company_or_reliable_tech_media
      require_verified_publication_date: true
  - id: miit-information-communications
    name: 工信部信息通信
    kind: html_list
    entry_url: https://www.miit.gov.cn/
    priority: 100
    language: zh-CN
    request_timeout_seconds: 20
    max_items_per_run: 20
    config:
      briefing_category: telecom
      timezone: Asia/Shanghai
  - id: zte-official-news
    name: 中兴通讯新闻中心
    kind: html_list
    entry_url: https://www.zte.com.cn/china/about/news.html
    priority: 90
    language: zh-CN
    request_timeout_seconds: 20
    max_items_per_run: 20
    config:
      briefing_category: telecom
      article_url_path_prefixes:
        - /content/zte-site/www-zte-com-cn/china/about/news/
      timezone: Asia/Shanghai
  - id: c114-operators
    name: C114 电信运营商
    kind: html_list
    entry_url: https://www.c114.com.cn/local/
    priority: 85
    language: zh-CN
    request_timeout_seconds: 20
    max_items_per_run: 40
    config:
      briefing_category: telecom
      article_url_path_prefixes:
        - /news/
      date_context_tags: [li, div]
      allow_month_day_dates: true
      timezone: Asia/Shanghai
  - id: c114-equipment
    name: C114 设备商动态
    kind: html_list
    entry_url: https://www.c114.com.cn/news/18.html
    priority: 70
    language: zh-CN
    request_timeout_seconds: 20
    max_items_per_run: 40
    config:
      briefing_category: telecom
      article_url_path_prefixes:
        - /news/
      date_context_tags: [li, div]
      allow_month_day_dates: true
      timezone: Asia/Shanghai
  - id: leiphone-feed
    name: 雷峰网
    kind: rss
    entry_url: https://www.leiphone.com/feed
    priority: 70
    language: zh-CN
    request_timeout_seconds: 20
    max_items_per_run: 60
    config:
      briefing_category: ai
  # Vertical AI outlets, adopted 2026-09-04 in place of comprehensive hot
  # lists. 量子位 (qbitai.com/feed) and AIHOT (aihot.virxact.com/feed/all.xml)
  # are direct zh-CN AI-only feeds, verified from the deployment with
  # minute-fresh pubDates; AIbase resolves through the deployment's own RSSHub
  # instance (DAILYCAST_BRIEFING__RSSHUB_BASE_URL, ACCESS_KEY injected from
