# Candidate-pool policy for the two daily management briefings.
# Semantic relevance and reporting suitability are decided by the LLM from the
# verified evidence. Local code only applies objective caps and source balance.
categories:
  telecom:
    tiers: [LLM]
    editorial_selection: true
    # Twenty source-balanced candidates give the editor enough room to select
    # six substantive domestic telecom management stories without one feed
    # defining the agenda.
    editorial_candidate_limit: 20
    editorial_max_candidates_per_publisher: 10
  ai:
    tiers: [LLM]
    editorial_selection: true
    editorial_candidate_limit: 20
    # Source balance prevents an early batch from a prolific outlet hiding
    # later product, deployment and market candidates before LLM review.
    editorial_max_candidates_per_publisher: 10
