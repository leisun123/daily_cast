# Literal, deterministic selection policy for the two daily management briefings.
# Chinese terms use substring matching. ASCII terms use case-insensitive token
# boundaries, so short terms such as RAN and AI cannot match inside longer words.
categories:
  telecom:
    tiers: [P0, P1, P2, P3, P4, P5]
    # Within P0, show one signal from each management subtopic before repeating one.
    diversify_first_tiers: [P0]
    # A single outlet must not fill the management briefing, even through multiple feeds.
    max_items_per_publisher: 1
    # If distinct verified outlets cannot fill the report, one outlet may contribute
    # one additional item; it still can never dominate the six-item briefing.
    fallback_max_items_per_publisher: 2
    rules:
      - id: telecom-changzhou
        tier: P0
        specificity: 700
        all_groups:
          - [常州, 溧阳, 金坛, 武进, 新北, 天宁, 钟楼]
          - [中国移动, 中国电信, 中国联通, 运营商, 通信, 电信, 基站, 无线网, 5G, 6G, 算力网络, 华为, 中兴]
        reason: 常州本地通信与运营商直接动态
      - id: telecom-jiangsu
        tier: P0
        specificity: 650
        all_groups:
          - [江苏, 南京, 无锡, 徐州, 苏州, 南通, 连云港, 淮安, 盐城, 扬州, 镇江, 泰州, 宿迁]
          - [中国移动, 中国电信, 中国联通, 运营商, 通信, 电信, 基站, 无线网, 5G, 6G, 算力网络, 华为, 中兴]
        reason: 江苏省内通信与运营商动态
      - id: telecom-other-domestic-region
        tier: P0
        specificity: 600
        all_groups:
          - [北京, 上海, 天津, 重庆, 河北, 山西, 辽宁, 吉林, 黑龙江, 浙江, 安徽, 福建, 江西, 山东, 河南, 湖北, 湖南, 广东, 海南, 四川, 贵州, 云南, 陕西, 甘肃, 青海, 广西, 西藏, 宁夏, 新疆, 内蒙古, 深圳, 成都, 武汉, 杭州, 广州, 青岛, 厦门, 大连, 西安]
          - [中国移动, 中国电信, 中国联通, 运营商, 通信, 电信, 基站, 无线网, 5G, 6G, 算力网络, 华为, 中兴]
        reason: 国内其他地区通信与运营商动态
      - id: telecom-china-mobile
        tier: P0
        specificity: 500
        max_items_per_briefing: 2
        all_groups:
          - [中国移动, 中国移动通信, 中国移动集团, 中移]
        none_of: [移动支付, 移动应用, 移动游戏, 移动办公]
        reason: 中国移动直接动态
      - id: telecom-base-station
        tier: P0
        specificity: 450
        all_groups:
          - [基站, 无线接入, 无线网, RAN, 室分]
          - [建设, 新建, 共建共享, 招标, 集采, 部署, 开通, 改造, 商用]
        reason: 基站或无线网络建设进展
      - id: telecom-spectrum-and-permit
        tier: P0
        specificity: 400
        all_groups:
          - [频谱, 频段, 无线电许可, 用频]
          - [分配, 规划, 划转, 核发, 许可, 调整]
        reason: 频谱或许可直接影响网络能力
      - id: telecom-advanced-network
        tier: P0
        specificity: 350
        all_groups:
          - [5G-A, 5G Advanced, 6G]
          - [建设, 新建, 共建共享, 招标, 集采, 部署, 开通, 改造, 商用]
        reason: 下一代网络商用进程
      - id: telecom-operator-competition
        tier: P1
        specificity: 300
        all_groups:
          - [中国电信, 中国联通]
          - [建设, 招标, 集采, 部署, 开通, 商用, 资费, 合作, 合同, 并购, 财报]
        reason: 运营商竞争与经营动态
      - id: telecom-huawei-zte-network-supply
        tier: P2
        specificity: 250
        all_groups:
          - [华为, 中兴]
          - [商用, 部署, 供货, 交付, 招标, 集采, 合作, 发布, 扩产]
        none_of: [手机, Mate, Pura, 鸿蒙, 汽车, 问界, 智界]
        reason: 核心网络设备供给动态
      - id: telecom-critical-supply
        tier: P2
        specificity: 240
        all_groups:
          - [光模块, 光芯片, 交换机, 路由器, 核心网, 卫星通信]
          - [商用, 部署, 供货, 交付, 招标, 集采, 合作, 发布, 扩产]
        reason: 关键网络供给动态
      - id: telecom-policy-project-governance
        tier: P3
        specificity: 200
        all_groups:
          - [工信部, 通信管理局, 发改委, 国资委, 试点, 专项行动, 政策, 规划]
          - [通信, 电信, 网络, 5G, 6G, 算力网络, 基站]
        reason: 通信相关政策与项目治理
      - id: telecom-supplier-market
        tier: P4
        specificity: 100
        all_groups:
          - [诺基亚, 爱立信, 高通, 博通, 思科, 三星网络, Marvell, 中际旭创, 新易盛, 亨通光电, 长飞光纤]
          - [发布, 合作, 供货, 中标, 招标, 交付, 财报, 扩产]
        reason: 供应商市场与交付动态
      - id: telecom-domestic-industry-fallback
        tier: P5
        specificity: 50
        all_groups:
          - [信通院, CAICT, IMT-2030, 中国通信标准化协会, 中国无线电协会]
          - [网络, 通信, 频谱, 5G, 6G, 卫星互联网, 算力网络]
        reason: 国内通信产业与标准兜底动态
    required_any_of:
      [中国移动, 中国电信, 中国联通, 三大运营商, 工信部, 通信管理局,
       信通院, CAICT, IMT-2030, 华为, 中兴, 常州, 江苏, 北京, 上海, 天津,
       重庆, 河北, 山西, 辽宁, 吉林, 黑龙江, 浙江, 安徽, 福建, 江西,
       山东, 河南, 湖北, 湖南, 广东, 海南, 四川, 贵州, 云南, 陕西, 甘肃,
       青海, 广西, 西藏, 宁夏, 新疆, 内蒙古, 全国, 国内]
    fallback_any_of:
      [中国移动, 中国电信, 中国联通, 三大运营商,
       通信业, 电信网, 运营商, 光通信, 卫星通信, 网络设备, 5G, 6G, 算力网络]
    fallback_tier: P5
    global_excludes:
      [电信诈骗, 反诈, 短信诈骗, 移动支付, 移动游戏, 移动应用,
       MobileX, AT&T, Verizon, Vodafone, Deutsche Telekom, NTT DOCOMO, KDDI, SK Telecom,
       海外运营商, 美国运营商, 欧洲运营商]
  ai:
    # AI relevance is editorial rather than keyword-gated: candidate links have
    # already passed freshness and reader-link verification, then the LLM selects
    # the six management-relevant items from a source-balanced pool.
    tiers: [LLM]
    editorial_selection: true
    editorial_candidate_limit: 20
    # Keep source balance but do not let early paper-only entries hide later
    # verified product and deployment news from the same reliable feed.
    editorial_max_candidates_per_source: 10
    # Prefer at most two reports from one outlet. If the verified pool genuinely
    # lacks alternatives, relax only enough to keep the six-item report complete.
    max_items_per_publisher: 2
    fallback_max_items_per_publisher: 6
    rules: []
    fallback_any_of: []
    global_excludes: []
    paper_only_terms: []
