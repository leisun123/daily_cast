# Source configuration example. V0.1 Alpha ships an RSS collector and extracts
# linked web-page text through the shared safe HTTP extractor. No source
# credential belongs in this file.
sources:
  - id: hacker-news-rss
    name: Hacker News
    kind: rss
    # The maintained mirror serves the Hacker News front page feed with valid TLS.
    entry_url: https://hnrss.org/frontpage
    priority: 80
    language: en
    request_timeout_seconds: 20
    max_items_per_run: 50
    config: {}
