# Application identity and local development listener. Compose overrides the
# container listener to 0.0.0.0 while retaining a loopback host-port mapping.
app:
  name: DailyCast
  environment: development
  timezone: Asia/Shanghai
  public_only: false
  server:
    host: 127.0.0.1
    port: 8000

# SQLite is the V0.1 Alpha source of truth. Use an environment variable rather
# than YAML if a deployment needs a different local database path.
database:
  url: sqlite:///./data/dailycast.db
  echo: false

# Private task artifacts and public immutable RSS/media roots. Set DATA_DIR and
# PUBLIC_DIR in the environment to override these paths.
storage:
  data_dir: ./data
  public_dir: ./public

# Missing IDs from this seed file are created at startup. Existing Source rows
# remain authoritative, so user edits are never overwritten by a restart.
sources:
  config_path: ./config/sources.example.yaml

# The in-process scheduler is opt-in to prevent surprise local daily runs. When
# enabled, this cron runs in app.timezone and reuses one stable TaskRun identity
# for each daily edition, even if the process restarts or the scheduler fires twice.
scheduler:
  enabled: false
  cron_expression: "0 8 * * *"

# A durable deadline ends an overlong task at checkpoint boundaries. It is not
# a queue timeout and does not require an additional worker or broker.
task_execution:
  deadline_seconds: 1800

# The OpenAI Responses model is preferred. Provider-level failures route once
# to the configured DeepSeek fallback. Both keys deliberately stay out of YAML.
llm:
  provider: openai_responses
  base_url: https://api.openai.com/v1
  model: gpt-5.6-terra
  temperature: 0.1
  top_p: null
  timeout_seconds: 30
  max_retries: 2
  response_format: json_schema
  fallback:
    provider: openai_compatible
    base_url: https://api.deepseek.com
    model: deepseek-chat
    temperature: 0.1
    top_p: null
    max_output_tokens: 2000
    timeout_seconds: 120
    max_retries: 2
    response_format: json_object
  budget:
    max_calls: 12
    max_input_tokens: 60000

editorial:
  # Alpha records deterministic/LLM quality findings but does not block output.
  # Set true to restore the strict review-required Episode gate.
  enforce_quality_gate: false
  max_candidates: 30
  max_selected_events: 8
  # Preserve room for broad domestic reporting instead of filling each episode with AI news.
  max_ai_events: 3
  min_domestic_events_when_available: 2
  # Keep one current Changzhou/Jiangsu exam or recruitment notice when available.
  min_recruitment_events_when_available: 1
  max_sources_per_event: 3
  max_chars_per_source: 1200
  max_total_evidence_chars: 24000
  min_publishable_events: 1
  target_duration_seconds: 900
  outline_duration_tolerance_seconds: 60
  max_outline_sections: 12
  estimated_chars_per_second: 4.0
  script_duration_tolerance_ratio: 0.20
  max_script_chars: 12000
  max_section_chars: 2400
  max_automatic_script_revisions: 1

# Bounded deterministic pre-LLM processing rules.
processing:
  max_age_hours: 36
  # Recurring exam and recruitment notices need a longer watch period than breaking news.
  source_max_age_hours:
    changzhou-public-recruitment: 336
    jiangsu-civil-service-notices: 336
  min_content_length: 300
  similarity_threshold: 0.58

# Edge TTS is the default draft-audio provider; its voice configuration is not
# a credential. TTS input is prepared after the reviewable script is stored,
# so pauses and pronunciation changes never rewrite editorial text.
tts:
  provider: edge_tts
  voice: zh-CN-XiaoxiaoNeural
  speed: 1.0
  format: mp3
  # edge-tts accepts escaped plain text only; this mode adds conservative paragraph pauses.
  text_mode: enhanced_text
  pronunciation_dictionary_path: config/pronunciation.yaml
  opening_summary_speed: 0.94
  closing_summary_speed: 0.94
  timeout_seconds: 30
  max_retries: 2
  cache_enabled: true

# Output normalization for the FFmpeg merger.
ffmpeg:
  sample_rate: 24000
  bitrate: "64k"

# Alpha automatically approves and publishes structurally valid Episode/audio
# pairs after merge. Set false to retain a local review-required draft only.
# public_base_url is the public enclosure origin and should be HTTPS for
# non-loopback deployment.
publishing:
  auto_publish: true
  public_base_url: http://127.0.0.1:8000
  feed_title: DailyCast
  feed_description: A personal AI news podcast.
  language: zh-CN
  author: DailyCast
  # RSS owns immutable media and remains the source of truth for all targets.
  rss:
    enabled: true
  # Playwright uses this persistent browser profile after you log in manually.
  # The relative path is rooted under DATA_DIR, never PUBLIC_DIR or source control.
  netease:
    enabled: false
    profile_dir: netease/profile
    # Set false for the first manual creator-center login, then return to true.
    headless: true
    creator_url: https://music.163.com/creatorcenter
    # Set an existing local cover image when enabling NetEase publication.
    cover_path: null
    category: 资讯
  # Xiaoyuzhou consumes standard RSS; DailyCast does not automate it yet.
  xiaoyuzhou:
    enabled: false

# Structured JSON logs are written to the console at this minimum level.
logging:
  level: INFO

# Optional daily telecom + AI text briefing pushed to a webhook target
# (WeCom group bot by default), independent of the podcast pipeline. Set the
# webhook URL via DAILYCAST_BRIEFING__WEBHOOK_URL in the environment.
briefing:
  enabled: false
  sources_config_path: ./config/briefing.sources.yaml
  selection_policy_path: ./config/briefing.selection.yaml
  # Prepare before the 08:30 delivery tick; the retry does nothing when ready.
  preparation_cron_expression: "55 7 * * mon-fri"
  preparation_retry_cron_expression: "15 8 * * mon-fri"
  cron_expression: "30 8 * * mon-fri"
  window_hours: 24
  max_items_per_category: 6
  max_evidence_chars_per_article: 800
  # Optional HTTP(S) endpoint for configured rsshub:// feeds such as 36Kr
  # 24-hour hot list. Use your known-good/self-hosted RSSHub instance; do not
  # depend on a random public mirror.
  rsshub_base_url: null
  webhook_enabled: false
  # wecom_markdown_v2 | wecom_markdown | generic_json ({"text": ...}, Slack-style targets)
  webhook_format: wecom_markdown_v2

# Use an independent Enterprise WeChat robot for operational alerts. Supply its
# URL with DAILYCAST_MONITORING__WEBHOOK_URL; no boolean enable switch is used.
monitoring:
  webhook_format: wecom_markdown_v2

# Native OpenAI web-search discovery is disabled in local development unless
# explicitly enabled. It is used only by the briefing-specific web_research
# source kind, never by the default podcast source pool.
web_research:
  enabled: false
  max_candidates_per_source: 20
  max_search_calls_per_source: 1
  search_context_size: medium
  max_article_chars: 12000
